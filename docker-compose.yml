services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aidbot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidbot}
      POSTGRES_USER: ${POSTGRES_USER:-aidbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidbot_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - aidbot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidbot} -d ${POSTGRES_DB:-aidbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: aidbot-backend
    environment:
      APP_NAME: ${APP_NAME:-AidBot}
      APP_ENV: ${APP_ENV:-development}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3010,http://127.0.0.1:3010}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aidbot}:${POSTGRES_PASSWORD:-aidbot_dev_password}@db:5432/${POSTGRES_DB:-aidbot}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-aidbot-local-v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-96}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload

  frontend:
    build:
      context: ./frontend
    container_name: aidbot-frontend
    environment:
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://backend:8010}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8010}
    ports:
      - "3010:3010"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  aidbot-postgres-data:
